(function () {
  // Sans service worker, l'icone posee sur l'ecran d'accueil donne le dinosaure de Chrome des
  // que le wifi tombe — en plein ecran, sans barre d'adresse. C'est la raison meme de la
  // publication qui echouait. Le fichier est dans public/sw.js, donc servi a cote de la page.
  try {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost'
        && location.hostname !== '127.0.0.1') return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  } catch (e) {}
})();
</script><script src="/easyread/_expo/static/js/web/entry-fc0cfe4caceacfe1f9ffe91bc9d6238a.js" defer></script>
