<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Le carré YM de la marque, réduit à l'essentiel : à 16 px un filet fin disparaît, alors le cadre
       est épais et les lettres prennent toute la place. Le filet doré en bas ancre le coin, comme
       sur le site et la signature. -->
  <rect width="64" height="64" fill="#0b1f3a"/>
  <rect x="7" y="7" width="50" height="46" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="32" y="39.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="0.5">YM</text>
  <rect x="0" y="59" width="19" height="5" fill="#d4a843"/>
</svg>
